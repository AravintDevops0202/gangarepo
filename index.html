<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Shopping Page</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family: Arial, sans-serif;
            background:#eaeded;
        }

        .navbar{
            background:#131921;
            color:white;
            padding:15px;
            text-align:center;
        }

        .navbar h1{
            color:#ff9900;
        }

        .banner{
            background:#febd69;
            text-align:center;
            padding:30px;
        }

        .products{
            display:flex;
            flex-wrap:wrap;
            justify-content:center;
            gap:20px;
            padding:20px;
        }

        .card{
            width:250px;
            background:white;
            padding:15px;
            border-radius:8px;
            box-shadow:0 2px 5px rgba(0,0,0,0.2);
            text-align:center;
        }

        .card img{
            width:100%;
            height:200px;
            object-fit:cover;
        }

        .price{
            color:green;
            font-weight:bold;
            margin:10px 0;
        }

        button{
            background:#ffd814;
            border:none;
            padding:10px 15px;
            border-radius:20px;
            cursor:pointer;
        }

        button:hover{
            background:#f7ca00;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <h1>Amazon Clone</h1>
    </div>

    <div class="banner">
        <h2>Welcome to Amazon Shopping</h2>
        <p>Great deals on electronics, fashion and more!</p>
    </div>

    <div class="products">

        <div class="card">
            <img src="https://picsum.photos/250/200?random=1" alt="Laptop">
            <h3>Laptop</h3>
            <p class="price">₹49,999</p>
            <button>Add to Cart</button>
        </div>

        <div class="card">
            <img src="https://picsum.photos/250/200?random=2" alt="Mobile">
            <h3>Smart Phone</h3>
            <p class="price">₹19,999</p>
            <button>Add to Cart</button>
        </div>

        <div class="card">
            <img src="https://picsum.photos/250/200?random=3" alt="Headphones">
            <h3>Headphones</h3>
            <p class="price">₹1,499</p>
            <button>Add to Cart</button>
        </div>

        <div class="card">
            <img src="https://picsum.photos/250/200?random=4" alt="Watch">
            <h3>Smart Watch</h3>
            <p class="price">₹2,999</p>
            <button>Add to Cart</button>
        </div>

    </div>

</body>
</html>
